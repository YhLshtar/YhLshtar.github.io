<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人博客</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <!-- 加载中提示遮罩，默认显示，加载完毕后淡出 -->
    <div id="loading-mask">
        <div class="loading-text">正在加载粒子特效...</div>
    </div>

    <!-- 全屏粒子背景容器 -->
    <div id="canvas-container"></div>

    <!-- 博客内容层 -->
    <div class="blog-wrapper">
        <header>
            <h1>我的个人博客</h1>
            <nav>
                <a href="./index.html">首页</a>
                <a href="./about/">关于我</a>
            </nav>
        </header>

        <main>
            <h2>最新文章</h2>
            <ul class="post-list">
                <li>
                    <span class="date">2026-09-13</span>
                    <a href="./posts/post1.html">我的第一篇文章</a>
                </li>
                <li>
                    <span class="date">2026-09-10</span>
                    <a href="./posts/post2.html">学习 GitHub Pages 的心得</a>
                </li>
            </ul>
        </main>

        <footer>
            <p>&copy; 2026 YhLshtar. All rights reserved.</p>
        </footer>
    </div>

    <!-- 在底部引入本地的 Three.js，并加 defer 属性让 DOM 先渲染 -->
    <script src="./js/three.min.js" defer></script>

    <script>
        // 等待所有 DOM 和 Three.js 加载完毕后再执行逻辑
        window.addEventListener('DOMContentLoaded', () => {
            // 简单的检查，确保 Three.js 加载成功
            if (typeof THREE === 'undefined') {
                console.error('Three.js 加载失败，请检查 ./js/three.min.js 路径');
                document.getElementById('loading-mask').style.display = 'none';
                return;
            }

            // --- 1. Three.js 场景初始化 ---
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 30;

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // --- 2. 创建爱心粒子系统 ---
            const particleCount = 3000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const targetPositions = new Float32Array(particleCount * 3);
            const randomPositions = new Float32Array(particleCount * 3);

            function getHeartPosition(t, scale = 1) {
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
                return { x: x * scale, y: y * scale, z: 0 };
            }

            for (let i = 0; i < particleCount; i++) {
                const t = Math.random() * Math.PI * 2;
                const scale = 0.5;
                const heartPos = getHeartPosition(t, scale);
                const r = Math.sqrt(Math.random());

                targetPositions[i * 3] = heartPos.x * r;
                targetPositions[i * 3 + 1] = heartPos.y * r;
                targetPositions[i * 3 + 2] = (Math.random() - 0.5) * 5;

                randomPositions[i * 3] = (Math.random() - 0.5) * 100;
                randomPositions[i * 3 + 1] = (Math.random() - 0.5) * 60;
                randomPositions[i * 3 + 2] = (Math.random() - 0.5) * 50;

                positions[i * 3] = randomPositions[i * 3];
                positions[i * 3 + 1] = randomPositions[i * 3 + 1];
                positions[i * 3 + 2] = randomPositions[i * 3 + 2];
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const material = new THREE.PointsMaterial({
                color: 0x00e5ff,
                size: 0.4,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });

            const particles = new THREE.Points(geometry, material);
            scene.add(particles);

            // --- 3. 动画控制变量 ---
            let gatherFactor = 0;
            let targetGatherFactor = 0;
            const clock = new THREE.Clock();

            // --- 4. 隐藏 Loading 遮罩 ---
            // 给一点延迟，确保第一帧渲染出来再隐藏，避免闪烁
            setTimeout(() => {
                const mask = document.getElementById('loading-mask');
                mask.style.opacity = '0';
                mask.style.visibility = 'hidden';
            }, 100);

            // --- 5. 动画循环 ---
            function animate() {
                requestAnimationFrame(animate);

                const time = clock.getElapsedTime();
                targetGatherFactor = (Math.sin(time * 1.0) + 1) / 2;
                gatherFactor += (targetGatherFactor - gatherFactor) * 0.05;

                particles.rotation.y += 0.003;
                particles.rotation.x += 0.001;

                const posAttr = particles.geometry.attributes.position;
                const currentPositions = posAttr.array;

                for (let i = 0; i < particleCount; i++) {
                    const idx = i * 3;
                    const tx = randomPositions[idx] + (targetPositions[idx] - randomPositions[idx]) * gatherFactor;
                    const ty = randomPositions[idx+1] + (targetPositions[idx+1] - randomPositions[idx+1]) * gatherFactor;
                    const tz = randomPositions[idx+2] + (targetPositions[idx+2] - randomPositions[idx+2]) * gatherFactor;

                    currentPositions[idx] += (tx - currentPositions[idx]) * 0.1;
                    currentPositions[idx+1] += (ty - currentPositions[idx+1]) * 0.1;
                    currentPositions[idx+2] += (tz - currentPositions[idx+2]) * 0.1;
                }

                posAttr.needsUpdate = true;
                renderer.render(scene, camera);
            }

            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        });
    </script>
</body>
</html>
